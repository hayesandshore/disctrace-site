<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 660" width="340" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- App stats screen. Every number is a 00 placeholder: no real data is shown. -->
  <rect x="4" y="4" width="332" height="652" rx="46" fill="#27313D"/>
  <rect x="16" y="16" width="308" height="628" rx="34" fill="#EEF1F3"/>
  <rect x="128" y="28" width="84" height="22" rx="11" fill="#27313D"/>

  <text x="38" y="92" font-size="12" font-weight="700" letter-spacing="1.4" fill="#55616F">LAST THROW</text>
  <text x="38" y="124" font-size="26" font-weight="800" fill="#27313D">Your numbers</text>

  <!-- Four measurements -->
  <rect x="38" y="144" width="126" height="92" rx="14" fill="#FFFFFF"/>
  <text x="52" y="170" font-size="10.5" font-weight="700" letter-spacing="1" fill="#55616F">SPEED</text>
  <text x="52" y="218" font-size="40" font-weight="800" fill="#27313D">00</text>

  <rect x="176" y="144" width="126" height="92" rx="14" fill="#FFFFFF"/>
  <text x="190" y="170" font-size="10.5" font-weight="700" letter-spacing="1" fill="#55616F">SPIN</text>
  <text x="190" y="218" font-size="40" font-weight="800" fill="#27313D">000</text>

  <rect x="38" y="248" width="126" height="92" rx="14" fill="#FFFFFF"/>
  <text x="52" y="274" font-size="10.5" font-weight="700" letter-spacing="1" fill="#55616F">RELEASE ANGLE</text>
  <text x="52" y="322" font-size="40" font-weight="800" fill="#27313D">00°</text>

  <rect x="176" y="248" width="126" height="92" rx="14" fill="#FFFFFF"/>
  <text x="190" y="274" font-size="10.5" font-weight="700" letter-spacing="1" fill="#55616F">DISTANCE</text>
  <text x="190" y="322" font-size="40" font-weight="800" fill="#27313D">00</text>

  <!-- Flight path -->
  <rect x="38" y="352" width="264" height="118" rx="14" fill="#27313D"/>
  <text x="52" y="378" font-size="10.5" font-weight="700" letter-spacing="1" fill="#B9C3CD">FLIGHT PATH</text>
  <path d="M56 448H284" stroke="#EEF1F3" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>
  <path d="M94 444V452M132 444V452M170 444V452M208 444V452M246 444V452" stroke="#EEF1F3" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>
  <path d="M58 446C104 388 198 372 280 430" fill="none" stroke="#FFC629" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="58" cy="446" r="4.5" fill="#EEF1F3"/>
  <circle cx="280" cy="430" r="6" fill="#FFC629" stroke="#27313D" stroke-width="2"/>

  <!-- AI coach -->
  <rect x="38" y="482" width="264" height="124" rx="14" fill="#FFC629"/>
  <text x="52" y="508" font-size="10.5" font-weight="800" letter-spacing="1" fill="#27313D">AI COACH</text>
  <text x="52" y="537" font-size="17" font-weight="800" fill="#27313D">What to work on next</text>
  <rect x="52" y="554" width="206" height="10" rx="5" fill="#27313D" fill-opacity=".28"/>
  <rect x="52" y="574" width="158" height="10" rx="5" fill="#27313D" fill-opacity=".28"/>

  <rect x="125" y="624" width="90" height="5" rx="2.5" fill="#27313D" fill-opacity=".3"/>
</svg>
