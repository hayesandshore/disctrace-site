      <circle cx="0" cy="-29" r="4.6" fill="#27313D"/>
    </g>
  </defs>

  <circle cx="260" cy="228" r="180" fill="#313D4B" stroke="#EEF1F3" stroke-opacity=".55" stroke-width="2.5"/>
  <g fill="none" stroke="#EEF1F3" stroke-opacity=".22" stroke-width="2">
    <ellipse cx="260" cy="228" rx="62" ry="180"/>
    <ellipse cx="260" cy="228" rx="124" ry="180"/>
    <path d="M260 48V408M80 228H440M95 156H425M95 300H425M137.6 96H382.4M137.6 360H382.4"/>
  </g>

  <!-- Course pins -->
  <g transform="translate(182 172)"><use href="#pin"/></g>
  <g transform="translate(336 134)"><use href="#pin"/></g>
  <g transform="translate(150 296)"><use href="#pin"/></g>
  <g transform="translate(374 306)"><use href="#pin"/></g>
  <g transform="translate(246 362)"><use href="#pin"/></g>

  <!-- Selected course -->
  <ellipse cx="292" cy="244" rx="34" ry="11" fill="none" stroke="#FFC629" stroke-opacity=".5" stroke-width="2.5"/>
  <ellipse cx="292" cy="244" rx="18" ry="6" fill="none" stroke="#FFC629" stroke-width="2.5"/>
  <g transform="translate(292 244) scale(1.8)"><use href="#pin"/></g>
</svg>
